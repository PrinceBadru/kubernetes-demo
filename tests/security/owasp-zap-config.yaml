# ==============================================================================
# DevSecOps Demo - OWASP ZAP Automation Framework Configuration
# ==============================================================================
# Purpose:
#   Automates Dynamic Application Security Testing (DAST) within CI/CD pipelines.
#   Scans the running containerized Express API for runtime vulnerabilities
#   including OWASP Top 10 flaws (Injection, Broken Authentication, SSRF, XSS,
#   Security Misconfiguration, and Sensitive Data Exposure).
#
# DevSecOps Integration:
#   - Runs after container deployment to a staging/ephemeral test namespace.
#   - Crawls all exposed routes (excluding internal Prometheus metrics).
#   - Executes both passive analysis (header inspection, cookie flags, leaks)
#     and active vulnerability fuzzing.
#   - Fails CI/CD pipeline if high or medium severity vulnerabilities are identified.
# ==============================================================================

env:
  contexts:
    - name: "DevSecOps Demo API"
      urls:
        - "http://localhost:3000"
      includePaths:
        - "http://localhost:3000/.*"
      excludePaths:
        # Exclude Prometheus metrics endpoint to avoid skewing telemetry & unnecessary noise
        - "http://localhost:3000/metrics"
        - "http://localhost:3000/favicon.ico"
      
      # Limit technology scope to optimize scan speed and reduce false positives
      technologies:
        include:
          - "Db.PostgreSQL"
          - "Language.JavaScript"
          - "OS.Linux"
          - "Server.NodeJS"
        exclude:
          - "Db.Microsoft SQL Server"
          - "Db.MySQL"
          - "Db.Oracle"
          - "Language.ASP"
          - "Language.C"
          - "Language.JSP_Servlet"
          - "Language.PHP"
          - "Language.Python"
          - "Language.Ruby"
          - "Server.Apache"
          - "Server.IIS"
          - "Server.Tomcat"

  parameters:
    failOnError: true
    progressToStdout: true
    continueOnFailure: false

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Spider (Crawler)
  # Explores API paths and endpoints to discover routes and attack surfaces.
  # ----------------------------------------------------------------------------
  - type: spider
    name: "Spider Crawl"
    parameters:
      context: "DevSecOps Demo API"
      url: "http://localhost:3000"
      maxDuration: 2
      maxDepth: 5
      maxChildren: 10
      acceptCookies: true
      handleParameters: "USE_ALL"

  # ----------------------------------------------------------------------------
  # Job 2: Passive Scan Wait
  # Allows passive scanners to evaluate all requests/responses captured
  # during the spider crawl (e.g., missing CSP, HSTS, secure cookie flags).
  # ----------------------------------------------------------------------------
  - type: passiveScan-wait
    name: "Passive Scan Wait"
    parameters:
      maxDuration: 5

  # ----------------------------------------------------------------------------
  # Job 3: Active Scan (Fuzzer & Vulnerability Exploit Validation)
  # Performs automated fuzzing targeting Injection, Traversal, and Auth bypass.
  # ----------------------------------------------------------------------------
  - type: activeScan
    name: "Active Scan"
    parameters:
      context: "DevSecOps Demo API"
      policy: "Default Policy"
      maxRuleDurationInMins: 5
      maxScanDurationInMins: 15
      addQueryParam: false
      handleAntiCSRFTokens: false
      injectPluginIdInHeader: true
      scanHeadersAllRequests: true

  # ----------------------------------------------------------------------------
  # Job 4: Traditional HTML Security Report
  # Generates human-readable compliance and vulnerability audit report.
  # ----------------------------------------------------------------------------
  - type: report
    name: "Generate HTML Security Report"
    parameters:
      template: "traditional-html"
      reportDir: "artifacts/security"
      reportFile: "zap-report"
      reportTitle: "DevSecOps Demo API - OWASP ZAP Security Audit Report"
      reportDescription: "Automated DAST evaluation assessing containerized API resilience against OWASP Top 10 vulnerabilities."
      displayReport: false

  # ----------------------------------------------------------------------------
  # Job 5: SARIF / JSON Report for CI/CD Tooling
  # Generates machine-readable output for GitHub Advanced Security / DefectDojo.
  # ----------------------------------------------------------------------------
  - type: report
    name: "Generate SARIF Security Report"
    parameters:
      template: "sarif-json"
      reportDir: "artifacts/security"
      reportFile: "zap-report-sarif"
      reportTitle: "DevSecOps Demo API - SARIF Output"
      displayReport: false

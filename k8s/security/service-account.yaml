# ==============================================================================
# ServiceAccount Configuration: Dedicated Identity with Token Isolation
# Namespace: devsecops-demo
# Framework: CIS Kubernetes Benchmark 5.1.5 & 5.1.6
# ==============================================================================
# Overview:
# In Kubernetes, every namespace is provisioned with a 'default' ServiceAccount.
# By default, Kubernetes mounts a long-lived API bearer token into every container
# at `/var/run/secrets/kubernetes.io/serviceaccount/token`.
#
# Threat Model & Risk Analysis:
# If an application container suffers from:
# 1. Local File Inclusion (LFI) / Arbitrary File Read:
#    The attacker can extract the API token directly from the filesystem.
# 2. Remote Code Execution (RCE):
#    The attacker uses curl/wget inside the container to query the internal
#    Kubernetes API server (`https://kubernetes.default.svc.cluster.local`).
# 3. Server-Side Request Forgery (SSRF):
#    The attacker can pivot requests against the control plane or node kubelet.
#
# DevSecOps Mitigation:
# 1. Dedicated ServiceAccount: Avoids shared identity across multiple workloads.
# 2. automountServiceAccountToken: false:
#    Instructs the kubelet NOT to mount the API credentials into pod volumes.
#    Since the API service is an Express.js backend that interacts only with
#    PostgreSQL and Redis (and does NOT interact with the Kubernetes API server),
#    it has zero legitimate requirement for an in-pod Kubernetes API token.
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-service-account
  namespace: devsecops-demo
  labels:
    app.kubernetes.io/name: api-service-account
    app.kubernetes.io/component: service-account
    app.kubernetes.io/part-of: devsecops-demo
  annotations:
    description: "Dedicated least-privilege ServiceAccount for devsecops-demo-api workloads with automatic token mounting disabled"
# Disabling token automounting eliminates in-pod API credentials (CIS Benchmark 5.1.6)
automountServiceAccountToken: false

# ==============================================================================
# Pod Security Admission (PSA) Configuration
# Namespace: devsecops-demo
# Framework: Pod Security Standards (PSS) - Restricted Profile
# ==============================================================================
# Overview:
# Pod Security Admission (PSA) replaces the deprecated PodSecurityPolicy (PSP)
# starting in Kubernetes 1.25. PSA is an admission controller that evaluates
# pod specifications against predefined Pod Security Standards (PSS):
# - Privileged: Completely unrestricted (equivalent to disabling pod security).
# - Baseline: Minimally restrictive, prevents known privilege escalation vectors.
# - Restricted: Heavily hardened, following current container hardening best practices.
#
# This file applies the `restricted` profile across all three admission modes:
# 1. Enforce: Rejects any pod manifest that fails to meet restricted standards.
# 2. Audit: Records policy violations in the Kubernetes audit log for SIEM analysis.
# 3. Warn: Surfaces immediate warning banners to developers/operators during kubectl apply.
#
# What the 'restricted' profile enforces on workloads:
# - Disallow Privileged Containers: containers cannot run with `securityContext.privileged: true`.
# - Non-Root Execution: must set `runAsNonRoot: true` with a non-zero UID.
# - Privilege Escalation: must explicitly set `allowPrivilegeEscalation: false`.
# - Linux Capabilities: must drop ALL capabilities (`drop: ["ALL"]`) and may only add NET_BIND_SERVICE.
# - Host Namespaces: disallows `hostNetwork: true`, `hostPID: true`, and `hostIPC: true`.
# - Host Ports: disallows binding directly to node host ports.
# - Volumes: restricts volume types to safe abstractions (configMap, secret, emptyDir, PVC, downwardAPI).
# - Seccomp: requires `seccompProfile.type: RuntimeDefault` (or Localhost).
#
# Usage:
# kubectl apply -f k8s/security/pod-security.yaml
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: devsecops-demo
  labels:
    # Standard project labels
    app.kubernetes.io/name: devsecops-demo
    app.kubernetes.io/component: namespace
    app.kubernetes.io/part-of: devsecops-demo

    # Pod Security Admission (PSA) - Enforce Mode:
    # Any workload failing restricted validation will be immediately rejected at admission.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest

    # Pod Security Admission (PSA) - Audit Mode:
    # Violations generate audit log events for compliance auditing (SOC 2, ISO 27001).
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest

    # Pod Security Admission (PSA) - Warn Mode:
    # Provides immediate feedback to developers if a workload does not meet restricted standards.
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest

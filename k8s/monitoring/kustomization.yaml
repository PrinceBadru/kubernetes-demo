apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# -----------------------------------------------------------------------------
# DevSecOps Principle: Declarative Observability Baseline (SRE Golden Signals)
# Provisions the monitoring namespace, network segmentation, Prometheus scraper,
# and Grafana dashboard infrastructure.
# -----------------------------------------------------------------------------
namespace: monitoring

resources:
  - namespace.yaml
  - pvc.yaml
  - network-policies.yaml
  - prometheus-config.yaml
  - prometheus-deployment.yaml
  - grafana-deployment.yaml

# -----------------------------------------------------------------------------
# DevSecOps Principle: Declarative Secret Provisioning (NEW-01)
# Ensures grafana-admin-credentials exists for declarative Kustomize composition.
# -----------------------------------------------------------------------------
generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: grafana-admin-credentials
    literals:
      - admin-user=admin
      - admin-password=demo-grafana-secure-pass-2026!

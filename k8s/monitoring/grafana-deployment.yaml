---
# =============================================================================
# DevSecOps Principle: Grafana Visualization Deployment Hardening
# - Runs strictly as non-root (UID 472: grafana)
# - Drops all Linux capabilities
# - Explicit resource limits to avoid cluster starvation
# - Default home dashboard configuration loads production API telemetry on start
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: devsecops-demo
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/component: monitoring
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: devsecops-demo
        app.kubernetes.io/managed-by: kubectl
    spec:
      automountServiceAccountToken: false
      # -----------------------------------------------------------------------
      # DevSecOps Principle: Pod Security Standards (Restricted Profile)
      # 1. runAsNonRoot: Enforces execution as unprivileged user.
      # 2. runAsUser/runAsGroup: 472 (official Grafana UID/GID).
      # 3. fsGroup: 472 ensures storage volumes are read/writable by grafana group.
      # 4. seccompProfile: RuntimeDefault prevents unauthorized syscalls.
      # -----------------------------------------------------------------------
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: grafana
          image: grafana/grafana:10.2.0@sha256:1ee0c54286b8ca09a3dd1419ff8653e7780a148a006ac088544203bb0affe550
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          # -------------------------------------------------------------------
          # DevSecOps Principle: Environment Hardening & Secure Default State
          # Secrets are mapped securely from K8s secrets.
          # Public self-registration and unsolicited reporting are disabled.
          # -------------------------------------------------------------------
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: admin-password
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: '/var/lib/grafana/dashboards/api-dashboard.json'
            - name: GF_USERS_ALLOW_SIGN_UP
              value: 'false'
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: 'false'
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: 'false'
            - name: GF_PATHS_DATA
              value: '/var/lib/grafana/data'

          # -------------------------------------------------------------------
          # DevSecOps Principle: Container-Level Least Privilege
          # Drops all Linux kernel capabilities. Prevents privilege escalation.
          # -------------------------------------------------------------------
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 472
            runAsGroup: 472
            capabilities:
              drop:
                - ALL

          # -------------------------------------------------------------------
          # DevSecOps Principle: Resource Quotas
          # Prevents Grafana query processing from starving other cluster workloads.
          # -------------------------------------------------------------------
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # -------------------------------------------------------------------
          # DevSecOps Principle: Liveness and Readiness Probes
          # Validates HTTP health endpoint before sending user traffic.
          # -------------------------------------------------------------------
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            # Mount read-only datasource configuration
            - name: datasource-config
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            # Mount read-only dashboard provider configuration
            - name: dashboard-provider-config
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            # Mount provisioned dashboard JSON files
            - name: dashboard-definition
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            # Mount writable data storage for internal SQLite DB / sessions
            - name: grafana-data-storage
              mountPath: /var/lib/grafana/data
            # Mount temporary scratch volume
            - name: tmp-volume
              mountPath: /tmp

      volumes:
        - name: datasource-config
          configMap:
            name: grafana-datasources
        - name: dashboard-provider-config
          configMap:
            name: grafana-dashboards-provider
        - name: dashboard-definition
          configMap:
            name: grafana-dashboards
        - name: grafana-data-storage
          emptyDir: {}
        - name: tmp-volume
          emptyDir: {}

---
# =============================================================================
# DevSecOps Principle: Service Exposition & Least Exposure
# Exposes Grafana internally via ClusterIP; access is managed via authenticated
# Ingress with TLS or controlled kubectl port-forward.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: devsecops-demo
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP

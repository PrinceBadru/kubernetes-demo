# =============================================================================
# DevSecOps Principle: GitOps Datasource Provisioning
# Datasources are defined declaratively as code rather than configured manually
# in the UI. This eliminates configuration drift, guarantees repeatability across
# dev/staging/prod clusters, and enforces read-only access to time-series backends.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: devsecops-demo
    app.kubernetes.io/managed-by: kubectl
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        uid: prometheus
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          timeInterval: 15s

---
# =============================================================================
# DevSecOps Principle: Declarative Dashboard Provisioning
# Automatically discovers and synchronizes dashboards from filesystem storage.
# Ensures on-call responders and SRE teams have instant visibility without
# manual dashboard export/import operations during incidents.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: devsecops-demo
    app.kubernetes.io/managed-by: kubectl
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'DevSecOps API Dashboards'
        orgId: 1
        folder: 'DevSecOps'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false

---
# =============================================================================
# DevSecOps Principle: Dashboard as Code (DaC)
# Version-controlled dashboard definitions ensure observable Golden Signals
# (Traffic, Latency, Errors, Saturation) are versioned alongside application code.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: devsecops-demo
    app.kubernetes.io/managed-by: kubectl
data:
  api-dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Production DevSecOps API Monitoring Dashboard covering Golden Signals (Latency, Traffic, Errors, Saturation), Service Dependencies, and Pod Resource Telemetry.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "Row 1 - Overview & Golden Signals",
          "type": "row"
        },
        {
          "collapsed": false,
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "DevSecOps Principle: Traffic Golden Signal - HTTP requests processed per second grouped by route and status code to measure demand and identify abnormal traffic surges.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "req/sec",
                "axisPlacement": "auto",
                "fillOpacity": 15,
                "gradientMode": "opacity",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "id": 1,
          "options": {
            "legend": {
              "calcs": ["mean", "lastNotNull", "max"],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(rate(http_requests_total{namespace=~\"$namespace\"}[5m])) by (route, status_code)",
              "legendFormat": "{{route}} [{{status_code}}]",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Request Rate (Traffic)",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "DevSecOps Principle: Error Golden Signal & SLO Tracking - Ratio of 5xx HTTP server responses against total requests. Critical for error budget protection.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 1 },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "(sum(rate(http_requests_total{namespace=~\"$namespace\",status_code=~\"5..\"}[5m])) or vector(0)) / (sum(rate(http_requests_total{namespace=~\"$namespace\"}[5m])) > 0) * 100",
              "legendFormat": "Error Rate",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Error Rate % (Errors)",
          "type": "stat"
        },
        {
          "collapsed": false,
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "DevSecOps Principle: High Availability & Scaling Observability - Number of active, healthy API pod instances currently serving traffic and reporting metrics.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "#EAB839", "value": 1 },
                  { "color": "green", "value": 2 }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 1 },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "count(count by (pod) (http_requests_total{namespace=~\"$namespace\"})) or count(up{namespace=~\"$namespace\",job=\"api\"})",
              "legendFormat": "Active Pods",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Active Pods",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 },
          "id": 101,
          "title": "Row 2 - Latency Analysis (p50 / p95 / p99)",
          "type": "row"
        },
        {
          "collapsed": false,
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "DevSecOps Principle: Latency Golden Signal - Percentile request durations showing typical user experience (p50) vs tail latency (p95/p99) to catch micro-outages and slow tail degradation.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "Duration",
                "axisPlacement": "auto",
                "fillOpacity": 10,
                "gradientMode": "opacity",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false
              },
              "unit": "s"
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "p99" },
                "properties": [{ "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }]
              },
              {
                "matcher": { "id": "byName", "options": "p95" },
                "properties": [{ "id": "color", "value": { "fixedColor": "orange", "mode": "fixed" } }]
              },
              {
                "matcher": { "id": "byName", "options": "p50" },
                "properties": [{ "id": "color", "value": { "fixedColor": "green", "mode": "fixed" } }]
              }
            ]
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
          "id": 4,
          "options": {
            "legend": {
              "calcs": ["mean", "lastNotNull", "max"],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])) by (le))",
              "legendFormat": "p50",
              "range": true,
              "refId": "p50"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])) by (le))",
              "legendFormat": "p95",
              "range": true,
              "refId": "p95"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])) by (le))",
              "legendFormat": "p99",
              "range": true,
              "refId": "p99"
            }
          ],
          "title": "Request Duration (p50 / p95 / p99)",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "DevSecOps Principle: Full Distribution Profiling - Heatmap of response times across bucket boundaries. Visualizes multi-modal latency distributions (e.g. cache hits vs slow DB queries).",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 10 },
          "id": 5,
          "options": {
            "calculate": false,
            "cellGap": 1,
            "color": {
              "exponent": 0.5,
              "fill": "dark-orange",
              "mode": "scheme",
              "reverse": false,
              "scale": "exponential",
              "scheme": "Spectral"
            },
            "exemplars": { "color": "rgba(255,0,255,0.7)" },
            "filterValues": { "le": 1e-9 },
            "legend": { "show": true },
            "rowsFrame": { "layout": "auto" },
            "tooltip": { "show": true, "yHistogram": false },
            "yAxis": { "axisPlacement": "left", "unit": "s" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(rate(http_request_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])) by (le)",
              "format": "heatmap",
              "legendFormat": "{{le}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Latency Heatmap",
          "type": "heatmap"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 },
          "id": 102,

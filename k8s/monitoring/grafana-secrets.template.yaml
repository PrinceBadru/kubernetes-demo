apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: devsecops-demo
    app.kubernetes.io/managed-by: kubectl
type: Opaque
# -----------------------------------------------------------------------------
# DevSecOps Principle: Secret Decoupling & Credential Isolation (NIST SP 800-53 IA-5)
# Real credentials must be injected dynamically at deployment time via
# demo/lib/generate-secrets.sh or enterprise KMS.
# -----------------------------------------------------------------------------
stringData:
  admin-user: 'admin'
  admin-password: 'REPLACE_WITH_GRAFANA_ADMIN_PASSWORD'

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: devsecops-demo
  labels:
    # -------------------------------------------------------------------------
    # Resource Identification Labels
    # Standard labels for tracking component ownership and deployment metadata.
    # -------------------------------------------------------------------------
    app.kubernetes.io/name: api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: devsecops-demo
    app.kubernetes.io/managed-by: kubectl
  annotations:
    # -------------------------------------------------------------------------
    # DevSecOps Principle: Edge Defense, Rate Limiting & DoS Protection
    # Rate limiting restricts client requests to 10 requests per second (rps).
    # This prevents brute-force attacks, API scraping, and volumetric layer 7 DoS.
    # -------------------------------------------------------------------------
    nginx.ingress.kubernetes.io/limit-rps: '10'

    # -------------------------------------------------------------------------
    # DevSecOps Principle: Payload Size Restriction & Memory Exhaustion Defense
    # Limits maximum client request body size to 1 Megabyte (1m).
    # Blocks malicious oversized uploads designed to exhaust API container memory.
    # -------------------------------------------------------------------------
    nginx.ingress.kubernetes.io/proxy-body-size: '1m'

    # -------------------------------------------------------------------------
    # DevSecOps Principle: Enforced Encryption-in-Transit (TLS)
    # Automatically redirects unencrypted HTTP traffic (port 80) to HTTPS (port 443).
    # Ensures all user tokens, credentials, and sensitive payloads are encrypted in flight.
    # -------------------------------------------------------------------------
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
spec:
  ingressClassName: nginx
  # ---------------------------------------------------------------------------
  # DevSecOps Principle: Transport Layer Security (TLS) Termination
  # Production TLS termination secret. To enable:
  # 1. Generate or issue certificate via cert-manager / Let's Encrypt or corporate PKI.
  # 2. Store certificate and private key in Secret 'api-tls'.
  # 3. Uncomment the block below.
  # ---------------------------------------------------------------------------
  # tls:
  #   - hosts:
  #       - devsecops-demo.local
  #     secretName: api-tls
  rules:
    - host: devsecops-demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80

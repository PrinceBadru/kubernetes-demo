apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: devsecops-demo
  labels:
    # -------------------------------------------------------------------------
    # Resource Identification Labels
    # Standard labels for tracking component ownership and deployment metadata.
    # -------------------------------------------------------------------------
    app.kubernetes.io/name: api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: devsecops-demo
    app.kubernetes.io/managed-by: kubectl
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  # ---------------------------------------------------------------------------
  # DevSecOps Principle: Elastic Scalability & Boundary Enforcement
  # minReplicas (2): Enforces High Availability baseline even during low-traffic periods.
  # maxReplicas (5): Sets a strict ceiling to prevent runaway scaling during application bugs,
  # memory leaks, or DDoS floods, protecting cluster resources from total exhaustion.
  # ---------------------------------------------------------------------------
  minReplicas: 2
  maxReplicas: 5
  metrics:
    # Scale on CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Scale on Memory utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    # -------------------------------------------------------------------------
    # DevSecOps Principle: Flapping Prevention & Controlled Scaling Dynamics
    # scaleUp: Reacts quickly to sudden surges while using a 60s stabilization
    # window to smooth out momentary transient spikes.
    # scaleDown: Employs a conservative 120s stabilization window and gradual step-down
    # to avoid premature pod termination that could disrupt queued background jobs or
    # cause rapid cyclic thrashing (scale up -> scale down -> scale up).
    # -------------------------------------------------------------------------
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Min

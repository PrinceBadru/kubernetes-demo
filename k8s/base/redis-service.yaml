apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: devsecops-demo
  labels:
    # -------------------------------------------------------------------------
    # Resource Identification Labels
    # Standard labels for tracking component ownership and deployment metadata.
    # -------------------------------------------------------------------------
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: devsecops-demo
    app.kubernetes.io/managed-by: kubectl
spec:
  # ---------------------------------------------------------------------------
  # DevSecOps Principle: Network Segmentation & Internal Cache Isolation
  # Exposes Redis strictly within the cluster via ClusterIP. Redis instances
  # should never be directly accessible from outside the cluster, as default Redis
  # protocol communication lacks native transport layer security (TLS) and is vulnerable
  # to unauthorized memory tampering or cache poisoning attacks.
  # ---------------------------------------------------------------------------
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP

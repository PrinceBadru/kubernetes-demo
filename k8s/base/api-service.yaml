apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: devsecops-demo
  labels:
    # -------------------------------------------------------------------------
    # Resource Identification Labels
    # Standard labels for tracking component ownership and deployment metadata.
    # -------------------------------------------------------------------------
    app.kubernetes.io/name: api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: devsecops-demo
    app.kubernetes.io/managed-by: kubectl
spec:
  # ---------------------------------------------------------------------------
  # DevSecOps Principle: Network Perimeter & Internal Isolation
  # ClusterIP exposes the service on an internal IP address only reachable within
  # the cluster. External access is strictly controlled via an Ingress Controller,
  # preventing unmonitored or unauthenticated direct exposure of backend services.
  # ---------------------------------------------------------------------------
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: api
  ports:
    - name: http
      # -----------------------------------------------------------------------
      # Port Abstraction & Non-Privileged Port Binding
      # Exposes standard HTTP port 80 internally, while mapping to targetPort 3000
      # on the container. This allows the container to run strictly as an unprivileged
      # non-root user (Linux requires root/CAP_NET_BIND_SERVICE to bind ports < 1024).
      # -----------------------------------------------------------------------
      port: 80
      targetPort: 3000
      protocol: TCP

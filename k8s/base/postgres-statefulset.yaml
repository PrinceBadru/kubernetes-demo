apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: devsecops-demo
  labels:
    # -------------------------------------------------------------------------
    # Resource Identification Labels
    # Consistent standard labels across all Kubernetes resources
    # -------------------------------------------------------------------------
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: devsecops-demo
    app.kubernetes.io/managed-by: kubectl
spec:
  # ---------------------------------------------------------------------------
  # DevSecOps Principle: State Isolation & Stable Identity
  # StatefulSets provide stable, predictable network identifiers (postgres-0)
  # and dedicated persistent volume attachment lifecycle.
  # ---------------------------------------------------------------------------
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: devsecops-demo
        app.kubernetes.io/managed-by: kubectl
    spec:
      automountServiceAccountToken: false
      # -----------------------------------------------------------------------
      # DevSecOps Principle: Non-Root Execution & Pod Security Standards (Restricted)
      # 1. runAsNonRoot: Mandatory enforcement ensuring postgres never runs as root.
      # 2. runAsUser / runAsGroup: UID 999 is the default 'postgres' system user in alpine.
      # 3. fsGroup: Ensures Kubernetes automatically sets group ownership on PVC mounts.
      # 4. seccompProfile: RuntimeDefault restricts system calls to an approved safe baseline.
      # -----------------------------------------------------------------------
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: postgres
          image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
              protocol: TCP

          # -------------------------------------------------------------------
          # DevSecOps Principle: Configuration Decoupling & Secret Hygiene
          # Database username and database name are injected from ConfigMap.
          # Sensitive database credentials are retrieved securely from Secret.
          # PGDATA uses a subpath to prevent initdb failure from lost+found root dirs.
          # -------------------------------------------------------------------
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PG_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PG_DATABASE
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: PG_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          # -------------------------------------------------------------------
          # DevSecOps Principle: Container-Level Hardening
          # 1. allowPrivilegeEscalation: false prevents sub-processes from obtaining new privileges.
          # 2. capabilities.drop: [ALL] removes all root capabilities inside the container.
          # -------------------------------------------------------------------
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL

          # -------------------------------------------------------------------
          # DevSecOps Principle: Resource Bounds
          # Prevents database memory bloat and protects cluster stability.
          # -------------------------------------------------------------------
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

          # -------------------------------------------------------------------
          # DevSecOps Principle: Health & Readiness Verification
          # Probes run pg_isready as the application user against the application database.
          # Ensures traffic is only routed when the database engine is ready for queries.
          # -------------------------------------------------------------------
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - app
                - -d
                - auditor
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - app
                - -d
                - auditor
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: socket-dir
              mountPath: /var/run/postgresql
            - name: tmp-dir
              mountPath: /tmp

      volumes:
        # Ephemeral mounts for Unix sockets and temp files with non-root ownership
        - name: socket-dir
          emptyDir: {}
        - name: tmp-dir
          emptyDir: {}

  # ---------------------------------------------------------------------------
  # DevSecOps Principle: Data Durability & Persistent Storage Management (F-40, F-44)
  # volumeClaimTemplates dynamically provisions persistent volumes for state retention
  # across pod restarts, evictions, or rolling node upgrades:
  # - StorageClass: Omitting storageClassName relies on the cluster's default StorageClass
  #   (e.g., 'standard' in KinD/minikube, 'gp3' in AWS EKS, 'pd-balanced' in GCP GKE).
  #   If the target cluster does not have a default StorageClass, set storageClassName explicitly.
  # - Access Mode: ReadWriteOnce (RWO) guarantees dedicated single-node block volume mount,
  #   preventing split-brain corruption.
  # - Reclaim Policy: Cluster default (typically Delete in dev/demo, Retain in production).
  # ---------------------------------------------------------------------------
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/component: database
          app.kubernetes.io/part-of: devsecops-demo
          app.kubernetes.io/managed-by: kubectl
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

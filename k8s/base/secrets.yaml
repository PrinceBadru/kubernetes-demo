apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: devsecops-demo
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: devsecops-demo
    app.kubernetes.io/managed-by: kubectl
type: Opaque
# -----------------------------------------------------------------------------
# DevSecOps Principle: Secret Decoupling & GitOps Hygiene (NIST SP 800-53 IA-5)
# This manifest contains non-functional demonstration placeholders.
# Active deployments generate cryptographically random credentials via
# demo/lib/generate-secrets.sh or sync them from External Secrets / Vault.
# -----------------------------------------------------------------------------
stringData:
  PG_PASSWORD: 'REPLACE_WITH_SECURE_POSTGRES_PASSWORD'
  POSTGRES_PASSWORD: 'REPLACE_WITH_SECURE_POSTGRES_PASSWORD'
  API_AUTH_TOKEN: 'REPLACE_WITH_SECURE_API_AUTH_TOKEN'

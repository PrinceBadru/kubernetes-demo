apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: devsecops-demo
  labels:
    # -------------------------------------------------------------------------
    # Resource Identification Labels
    # Standard labels for tracking component ownership and deployment metadata.
    # -------------------------------------------------------------------------
    app.kubernetes.io/name: api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: devsecops-demo
    app.kubernetes.io/managed-by: kubectl
type: Opaque
# -----------------------------------------------------------------------------
# DevSecOps Principle: Secret Management, Encryption-at-Rest & GitOps Hygiene
#
# CRITICAL NOTICE:
# Native Kubernetes Secret data is base64-encoded, NOT cryptographically encrypted.
# Storing unencrypted secrets in source control poses severe security and compliance risks.
#
# Production Best Practices:
# 1. External Secrets Operator (ESO): Integrate Kubernetes directly with enterprise
#    secret stores (e.g., HashiCorp Vault, AWS Secrets Manager, Azure Key Vault, GCP Secret Manager).
#    ESO dynamically syncs secrets into cluster namespaces without exposing credentials in Git.
# 2. Bitnami Sealed Secrets: Encrypt secrets using asymmetric cryptography where only
#    the in-cluster controller holds the private decryption key, making sealed manifests safe for Git.
# 3. Mozilla SOPS / Age: Encrypt YAML values with cloud KMS keys prior to commit.
# 4. Cluster Security: Ensure Kubernetes etcd encryption at rest is enabled via KMS provider.
#
# The base64 values below are demonstration placeholders ('devsecops-demo' encoded).
# -----------------------------------------------------------------------------
data:
  # Database password used by the API service and Postgres initialization
  # Value: 'devsecops-demo' -> ZGV2c2Vjb3BzLWRlbW8=
  PG_PASSWORD: ZGV2c2Vjb3BzLWRlbW8=
  POSTGRES_PASSWORD: ZGV2c2Vjb3BzLWRlbW8=

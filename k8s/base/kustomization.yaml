apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# -----------------------------------------------------------------------------
# DevSecOps Principle: Declarative GitOps Baseline Management
# Kustomize base defines the immutable baseline manifests for the devsecops-demo
# application. Overlays (e.g. staging, production) can patch environments without
# duplicating core security postures.
# -----------------------------------------------------------------------------
namespace: devsecops-demo

resources:
  - configmap.yaml
  - service-account.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-hpa.yaml
  - postgres-statefulset.yaml
  - postgres-service.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - ingress.yaml

# -----------------------------------------------------------------------------
# DevSecOps Principle: Declarative Secret Provisioning (NEW-01)
# Provides baseline declarative secrets for local evaluation and GitOps preview.
# Production deployments override via SecretGenerator overlay, SealedSecrets, or ExternalSecrets.
# -----------------------------------------------------------------------------
generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: app-secrets
    literals:
      - PG_PASSWORD=demo-db-secret-unprivileged-2026!
      - POSTGRES_PASSWORD=demo-db-secret-unprivileged-2026!
      - API_AUTH_TOKEN=demo-api-auth-token-2026!

# -----------------------------------------------------------------------------
# Image Management: Configurable image name/tag overrides for CI and local deployments
# -----------------------------------------------------------------------------
images:
  - name: devsecops-demo-api
    newName: devsecops-demo-api
    newTag: '1.0.0'

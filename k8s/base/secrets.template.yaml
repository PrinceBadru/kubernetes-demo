apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: devsecops-demo
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: devsecops-demo
    app.kubernetes.io/managed-by: kubectl
type: Opaque
# -----------------------------------------------------------------------------
# DevSecOps Principle: Secret Management & GitOps Hygiene (NIST SP 800-53 IA-5)
# Real credentials must be injected dynamically at deployment time via
# demo/lib/generate-secrets.sh, HashiCorp Vault, or External Secrets Operator.
# Usable passwords must NEVER be committed to version control.
# -----------------------------------------------------------------------------
stringData:
  PG_PASSWORD: 'REPLACE_WITH_SECURE_POSTGRES_PASSWORD'
  POSTGRES_PASSWORD: 'REPLACE_WITH_SECURE_POSTGRES_PASSWORD'
  API_AUTH_TOKEN: 'REPLACE_WITH_SECURE_API_AUTH_TOKEN'

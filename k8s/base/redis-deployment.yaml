apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: devsecops-demo
  labels:
    # -------------------------------------------------------------------------
    # Resource Identification Labels
    # Standard labels for tracking component ownership and deployment metadata.
    # -------------------------------------------------------------------------
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: devsecops-demo
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: devsecops-demo
        app.kubernetes.io/managed-by: kubectl
    spec:
      automountServiceAccountToken: false
      # -----------------------------------------------------------------------
      # DevSecOps Principle: Pod Security Standards (Restricted) Compliance
      # 1. runAsNonRoot: Redis is strictly forbidden from running as UID 0 (root).
      # 2. runAsUser / runAsGroup: UID 999 corresponds to 'redis' in Alpine Linux.
      # 3. seccompProfile: RuntimeDefault blocks dangerous syscalls.
      # -----------------------------------------------------------------------
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          # -------------------------------------------------------------------
          # DevSecOps Principle: Resource Boundary Capping & Attack Surface Reduction
          # 1. --maxmemory 128mb: Enforces an application-level memory threshold
          #    well below the container 256Mi limit, preventing OOMKilled events.
          # 2. --maxmemory-policy allkeys-lru: Automatically evicts least recently
          #    used keys when cache capacity is full, maintaining predictable latency.
          # 3. --save "": Disables disk snapshotting (RDB) since Redis acts as an
          #    ephemeral cache; avoids disk I/O vulnerabilities and persistence leaks.
          # -------------------------------------------------------------------
          command:
            - 'redis-server'
            - '--maxmemory'
            - '128mb'
            - '--maxmemory-policy'
            - 'allkeys-lru'
            - '--save'
            - ''

          ports:
            - containerPort: 6379
              name: redis
              protocol: TCP

          # -------------------------------------------------------------------
          # DevSecOps Principle: Container-Level Hardening
          # 1. allowPrivilegeEscalation: false blocks privilege expansion.
          # 2. readOnlyRootFilesystem: true prevents tampering with binary files.
          # 3. capabilities.drop: [ALL] drops all Linux capabilities.
          # -------------------------------------------------------------------
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL

          # -------------------------------------------------------------------
          # DevSecOps Principle: Strict Resource Limits
          # Enforces predictable CPU & RAM bounds preventing resource contention.
          # -------------------------------------------------------------------
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

          # -------------------------------------------------------------------
          # DevSecOps Principle: Cache Health Observability
          # Probes test Redis responsiveness via native redis-cli ping.
          # -------------------------------------------------------------------
          readinessProbe:
            exec:
              command:
                - 'redis-cli'
                - 'ping'
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - 'redis-cli'
                - 'ping'
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # -------------------------------------------------------------------
          # DevSecOps Principle: Ephemeral Working Directories
          # Redis requires writable working directory (/data) and temp dir (/tmp)
          # mounted as isolated emptyDir volumes under a read-only root filesystem.
          # -------------------------------------------------------------------
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: tmp-dir
              mountPath: /tmp

      volumes:
        - name: redis-data
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp-dir
          emptyDir:
            sizeLimit: 32Mi

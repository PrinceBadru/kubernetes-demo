name: Deployment Pipeline

# ==============================================================================
# DevSecOps Pipeline: Automated Deployment & Progressive In-Cluster Verification
# Frameworks: GitOps Delivery, NIST SP 800-207 Zero Trust, Continuous Verification
# ==============================================================================
# Overview:
# This workflow orchestrates continuous deployment to the Kubernetes cluster:
# 1. Pipeline Gatekeeping: Runs only when explicitly dispatched or triggered
#    after successful upstream "Container Build & Scan".
# 2. Deployment Preflight: Validates KUBECONFIG secret existence and cluster
#    connectivity before modifying any cluster resources.
# 3. Layered Manifest Promotion:
#    - Step 1: Establishes Namespace with Pod Security Admission (restricted profile).
#    - Step 2: Enforces Security Controls (Default-Deny Network Policies, RBAC, Quotas).
#    - Step 3: Deploys Workload Base Manifests (ConfigMaps, Secrets, API, DB, Redis).
# 4. Rollout Validation: Awaits zero-downtime rolling update completion with timeout bounds.
# 5. In-Cluster Smoke Testing: Ephemeral curl probe validates service liveness.
# ==============================================================================

on:
  workflow_run:
    workflows: ['Container Build & Scan']
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_namespace:
        description: 'Target Kubernetes Namespace'
        required: false
        default: 'devsecops-demo'

permissions:
  contents: read

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Kubernetes Cluster
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      # ------------------------------------------------------------------------
      # DevSecOps Preflight: Validate Target Cluster & Credentials
      # Prevents blind execution against unavailable or misconfigured clusters.
      # ------------------------------------------------------------------------
      - name: Deployment preflight & credential verification
        id: preflight
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "=============================================="
          echo " Deployment Preflight Verification"
          echo "=============================================="

          if [ -z "$KUBECONFIG_SECRET" ]; then
            if [ "$IS_MANUAL" = "true" ]; then
              echo "::error::Manual deployment triggered, but KUBECONFIG secret is missing."
              echo "Action required: Configure repository secret 'KUBECONFIG' with your cluster access credentials."
              exit 1
            else
              echo "::notice::Automated deployment skipped: KUBECONFIG secret not configured in repository."
              echo "In-cluster deployment remains opt-in until a target cluster secret is declared."
              echo "skip_deploy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          mkdir -p "$HOME/.kube"
          if echo "$KUBECONFIG_SECRET" | base64 -d > "$HOME/.kube/config" 2>/dev/null; then
            echo "Decoded base64-encoded KUBECONFIG."
          else
            echo "$KUBECONFIG_SECRET" > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"

          CURRENT_CTX=$(kubectl config current-context 2>/dev/null || echo "unknown")
          echo "Active Kubernetes Context: ${CURRENT_CTX}"

          echo "Verifying API server reachability..."
          if ! kubectl cluster-info --request-timeout=10s; then
            echo "::error::Target Kubernetes API server is unreachable at context '${CURRENT_CTX}'."
            exit 1
          fi

          echo "Preflight check passed. Cluster is reachable."
          echo "skip_deploy=false" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------------
      # Manifest Application Steps (Executed only if preflight passes)
      # ------------------------------------------------------------------------
      - name: Apply namespace
        if: steps.preflight.outputs.skip_deploy != 'true'
        run: |
          echo "Applying namespace manifest (Pod Security Admission Restricted)..."
          kubectl apply -f k8s/namespace.yaml

      - name: Apply security policies
        if: steps.preflight.outputs.skip_deploy != 'true'
        run: |
          echo "Applying zero-trust network policies, RBAC, and quotas..."
          kubectl apply -f k8s/security/

      - name: Apply base manifests
        if: steps.preflight.outputs.skip_deploy != 'true'
        run: |
          echo "Applying base workload manifests (API, PostgreSQL, Redis, Ingress)..."
          kubectl apply -f k8s/base/

      - name: Wait for rollout
        if: steps.preflight.outputs.skip_deploy != 'true'
        run: |
          echo "Waiting for API deployment rollout to reach Ready state..."
          kubectl rollout status deployment/api -n devsecops-demo --timeout=120s

      - name: Smoke test
        if: steps.preflight.outputs.skip_deploy != 'true'
        run: |
          echo "Executing in-cluster API liveness check..."
          kubectl run curl-test --image=curlimages/curl --rm -i --restart=Never -n devsecops-demo -- curl -f -m 5 http://api/healthz

name: CI

# ==============================================================================
# DevSecOps Master Pipeline: Shift-Left Assurance & Immutable Promotion Chain
# Frameworks: NIST SP 800-218 (SSDF), SLSA Level 2, CIS Kubernetes Benchmark
# ==============================================================================
# Overview:
# This workflow orchestrates the end-to-end continuous integration and deployment
# pipeline with strict gatekeeping:
#
#   [Quality Gate]  ──┐
#                     ├──> [Build & Push Gate] ──> [Continuous Deployment]
#   [Security Gate] ──┘
#
# Publication to GHCR is strictly impossible if any lint, formatting, unit test,
# catalog contract, secret scan, SAST, dependency vulnerability, or manifest rule fails.
# ==============================================================================

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_namespace:
        description: 'Target Kubernetes Namespace'
        required: false
        default: 'devsecops-demo'

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
  attestations: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Gate 1: Code Quality, Contracts & Layered Tests
  # ============================================================================
  quality:
    name: Code Quality & Layered Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Verify static syntax & security lint rules (ESLint)
        run: npm run lint

      - name: Verify code style formatting (Prettier)
        run: npm run format:check

      - name: Execute layered application tests (node:test)
        run: npm test

      - name: Validate scenario catalog integrity & schema
        run: npm run validate:catalog

  # ============================================================================
  # Gate 2: Security Scanning & Shift-Left Assurance
  # ============================================================================
  security:
    name: Security Scanning & IaC Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full git history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Semgrep SAST Scanner
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: 'p/nodejs p/javascript p/owasp-top-ten'

      - name: Audit Node.js package dependencies
        run: npm audit --audit-level=high

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          format: 'table'

      - name: Run kube-linter on Kubernetes manifests
        uses: stackrox/kube-linter-action@87802a2f4e01abebb3ee3c67a3002fea71f6eae5 # v1.0.7
        with:
          directory: 'k8s'

      - name: Run Checkov IaC Security Scanner
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # master
        with:
          directory: 'k8s/'
          framework: 'kubernetes'
          skip_check: 'CKV_K8S_15,CKV_K8S_43,CKV_K8S_40,CKV_K8S_35,CKV_K8S_38,CKV_K8S_21,CKV_K8S_9'
          soft_fail: false

  # ============================================================================
  # Gate 3: Single-Build Immutable Container Promotion (SLSA Level 2)
  # Gated by Quality AND Security checks.
  # ============================================================================
  build-and-publish:
    name: Build, Scan & Promote Container
    needs: [quality, security]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_uri: ${{ steps.prep.outputs.image_uri }}
      image_digest: ${{ steps.push.outputs.image_digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare container repository name
        id: prep
        run: |
          LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URI="ghcr.io/${LOWER_REPO}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "Target Container URI: ${IMAGE_URI}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Build image once and load into local Docker daemon for pre-publish scanning
      - name: Build container image locally
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.2
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: |
            ${{ env.IMAGE_URI }}:${{ github.sha }}
            ${{ env.IMAGE_URI }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Strict Shift-Left Container Gate: Hard failure on unpatched CVEs
      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_URI }}:${{ github.sha }}
          scan-type: 'image'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          format: 'table'

      # Push the exact scanned image without rebuilding
      - name: Push verified image to GHCR & verify remote manifest equality
        id: push
        run: |
          echo "Publishing verified container image to GHCR..."
          docker push "${{ env.IMAGE_URI }}:${{ github.sha }}"
          docker push "${{ env.IMAGE_URI }}:latest"

          IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ env.IMAGE_URI }}:${{ github.sha }}")
          DIGEST_SHA=$(echo "$IMAGE_DIGEST" | awk -F'@' '{print $2}')
          echo "image_digest=${DIGEST_SHA}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_DIGEST=${DIGEST_SHA}" >> "$GITHUB_ENV"
          echo "Published immutable digest: ${IMAGE_DIGEST}"

          # F-03: Assert remote registry manifest digest matches local inspected digest (Fail-closed)
          echo "Verifying published registry manifest digest matches local digest..."
          REGISTRY_MANIFEST_DIGEST=$(docker buildx imagetools inspect "${{ env.IMAGE_URI }}:${{ github.sha }}" 2>&1 | grep -i "Digest:" | awk '{print $2}' || true)
          if [ -z "$REGISTRY_MANIFEST_DIGEST" ]; then
            echo "::error::Failed to retrieve published registry manifest digest for ${{ env.IMAGE_URI }}:${{ github.sha }}"
            exit 1
          fi
          echo "Remote registry manifest digest: ${REGISTRY_MANIFEST_DIGEST}"
          if [ "$REGISTRY_MANIFEST_DIGEST" != "$DIGEST_SHA" ]; then
            echo "::error::Registry digest mismatch! Local: ${DIGEST_SHA}, Remote: ${REGISTRY_MANIFEST_DIGEST}"
            exit 1
          fi
          echo "Registry equality verified: remote manifest matches local scanned digest."

          mkdir -p artifacts
          echo "${IMAGE_DIGEST}" > artifacts/image-digest.txt

      - name: Generate Software Bill of Materials (SBOM)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_URI }}@${{ steps.push.outputs.image_digest }}
          scan-type: 'image'
          format: 'spdx-json'
          output: 'sbom.spdx.json'

      - name: Archive SBOM & Digest Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-artifacts-${{ github.sha }}
          path: |
            sbom.spdx.json
            artifacts/image-digest.txt
          retention-days: 30

  # ============================================================================
  # Gate 4: Continuous Deployment with In-Cluster Verification
  # ============================================================================
  deploy:
    name: Deploy to Kubernetes Cluster
    needs: [build-and-publish]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup kubectl
        uses: azure/setup-kubectl@3e0aec4d80787158d308d7b364cb1b702e7feb7f # v4.0.0
        with:
          version: 'v1.30.0'

      - name: Deployment preflight & credential verification
        id: preflight
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -z "$KUBECONFIG_SECRET" ]; then
            if [ "$IS_MANUAL" = "true" ]; then
              echo "::error::Manual deployment triggered, but KUBECONFIG secret is missing."
              exit 1
            else
              echo "::notice::Automated deployment skipped: KUBECONFIG secret not configured in repository."
              echo "skip_deploy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          mkdir -p "$HOME/.kube"
          if echo "$KUBECONFIG_SECRET" | base64 -d > "$HOME/.kube/config" 2>/dev/null; then
            echo "Decoded base64-encoded KUBECONFIG."
          else
            echo "$KUBECONFIG_SECRET" > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"

          if ! kubectl cluster-info --request-timeout=10s; then
            echo "::error::Target Kubernetes API server is unreachable."
            exit 1
          fi

          echo "skip_deploy=false" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        if: steps.preflight.outputs.skip_deploy != 'true'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-artifacts-${{ github.sha }}
          path: artifacts

      - name: Verify release metadata and digest binding (F-29)
        if: steps.preflight.outputs.skip_deploy != 'true'
        env:
          EXPECTED_DIGEST: ${{ needs.build-and-publish.outputs.image_digest }}
        run: |
          RECORDED_DIGEST=$(cat artifacts/image-digest.txt)
          if [ "${RECORDED_DIGEST}" != "${EXPECTED_DIGEST}" ]; then
            echo "::error::Release artifact digest mismatch! Expected ${EXPECTED_DIGEST}, found ${RECORDED_DIGEST}"
            exit 1
          fi
          test -f artifacts/sbom.spdx.json || (echo "::error::Missing SBOM artifact" && exit 1)
          echo "Release metadata and SBOM provenance verified against digest ${EXPECTED_DIGEST}."

      - name: Validate and apply namespace
        if: steps.preflight.outputs.skip_deploy != 'true'
        env:
          TARGET_NAMESPACE: ${{ inputs.target_namespace || 'devsecops-demo' }}
        run: |
          if [[ ! "${TARGET_NAMESPACE}" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]] || [ ${#TARGET_NAMESPACE} -gt 63 ]; then
            echo "::error::Invalid target namespace name '${TARGET_NAMESPACE}'. Must match RFC 1123 label format."
            exit 1
          fi
          sed "s/name: devsecops-demo/name: ${TARGET_NAMESPACE}/g" k8s/namespace.yaml | kubectl apply -f -

      - name: Apply security policies
        if: steps.preflight.outputs.skip_deploy != 'true'
        env:
          TARGET_NAMESPACE: ${{ inputs.target_namespace || 'devsecops-demo' }}
        run: |
          cd k8s/security
          kustomize edit set namespace "${TARGET_NAMESPACE}"
          cd ../..
          kubectl apply -k k8s/security/

      - name: Configure deployment image via Kustomize
        if: steps.preflight.outputs.skip_deploy != 'true'
        env:
          IMAGE_URI: ${{ needs.build-and-publish.outputs.image_uri }}
          IMAGE_DIGEST: ${{ needs.build-and-publish.outputs.image_digest }}
          TARGET_NAMESPACE: ${{ inputs.target_namespace || 'devsecops-demo' }}
        run: |
          echo "Setting deployment image to ${IMAGE_URI}@${IMAGE_DIGEST} via Kustomize..."
          cd k8s/base
          kustomize edit set namespace "${TARGET_NAMESPACE}"
          kustomize edit set image devsecops-demo-api="${IMAGE_URI}@${IMAGE_DIGEST}"
          cd ../..

      - name: Apply base workloads with Kustomize
        if: steps.preflight.outputs.skip_deploy != 'true'
        run: kubectl apply -k k8s/base/

      - name: Wait for API rollout
        if: steps.preflight.outputs.skip_deploy != 'true'
        env:
          TARGET_NAMESPACE: ${{ inputs.target_namespace || 'devsecops-demo' }}
        run: kubectl rollout status deployment/api -n "${TARGET_NAMESPACE}" --timeout=120s

      - name: Verify deployed Pod imageID matches approved registry digest (F-01)
        if: steps.preflight.outputs.skip_deploy != 'true'
        env:
          TARGET_NAMESPACE: ${{ inputs.target_namespace || 'devsecops-demo' }}
          EXPECTED_DIGEST: ${{ needs.build-and-publish.outputs.image_digest }}
        run: |
          echo "Verifying running pod imageID against approved digest ${EXPECTED_DIGEST}..."
          POD_IMAGE_IDS=$(kubectl get pods -n "${TARGET_NAMESPACE}" -l app.kubernetes.io/name=api -o jsonpath='{.items[*].status.containerStatuses[?(@.name=="api")].imageID}')
          echo "Observed Pod ImageIDs: ${POD_IMAGE_IDS}"
          for image_id in ${POD_IMAGE_IDS}; do
            if [[ "${image_id}" != *"${EXPECTED_DIGEST}"* ]]; then
              echo "::error::Pod running unapproved imageID: ${image_id}. Expected digest: ${EXPECTED_DIGEST}"
              exit 1
            fi
          done
          echo "All ready API pods verified running approved digest ${EXPECTED_DIGEST}."

      - name: In-cluster smoke test
        if: steps.preflight.outputs.skip_deploy != 'true'
        env:
          TARGET_NAMESPACE: ${{ inputs.target_namespace || 'devsecops-demo' }}
        run: |
          kubectl run curl-test --image=curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b --rm -i --restart=Never -n "${TARGET_NAMESPACE}" -- curl -f -m 5 http://api/healthz
